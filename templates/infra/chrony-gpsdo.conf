# TITAN chrony — LBE-1425 GPSDO PPS via Intel E810-XXVDA4T
# (copy to /etc/chrony/chrony.conf.d/titan-gpsdo.conf)
# Out1 1 PPS → E810 SMA-IN; Out2 10 MHz → E810 U.FL-IN
# Sub-ms clock sync for log correlation + DEX/sequencer timestamp alignment

refclock SHM 0 refid GPS precision 1e-3 offset 0.0 delay 0.0
refclock PPS /dev/pps0 lock GPS refid PPS precision 1e-9

# LAN peers (TITANSPARK, vault) — low poll for fast convergence
allow 192.168.10.0/24
allow 10.0.10.0/24

makestep 0.1 3
maxupdateskew 100.0
rtcsync

# Drift >500ppm during trading window → FORGE alert
log measurements statistics tracking
