# TITAN Edge Mesh — 5 PoP full mesh (paper + live, same routing)
# Deploy: ~/.openclaw/infra/edge_mesh.yaml
# Latency: each PoP colocated near DEX / L2 sequencer / builder infrastructure.
# Strict DEX-only (R02 / R46) — no CEX trading venues.

version: "2.0"
mode: full_mesh
paper_trading:
  latency_faithful: true
  note: "Paper uses identical PoP routing + RTT probes as live — measures true TCA/latency during shadow"

routing_policy: lowest_live_p50_rtt
operating_domain: dex_only

pops:
  EDGE-FRA:
    wireguard_ip: "10.0.10.100"
    provider: vultr
    region: eu-central
    instance: bare_metal
    roles: [erigon_archive, jito_fra, eth_builders, eu_dex, telegram_relay, solana_eu]
    targets:
      dex: [uniswap_v4, curve, balancer, cow_protocol]
      chains: [ethereum, arbitrum, optimism, base, solana_eu]
      infra: [jito_block_engine_fra, flashbots_eu]
    rtt_target_p95_ms: 5
    worker_port: 19100

  EDGE-TKY:
    wireguard_ip: "10.0.10.101"
    provider: aws
    region: ap-northeast-1
    instance: c7i.metal-24xl
    roles: [hyperliquid_dex, jito_tky]
    targets:
      dex: [hyperliquid]
      chains: [hyperliquid_l1]
      infra: [jito_tky]
    rtt_target_p95_ms: 1
    worker_port: 19100

  EDGE-SIN:
    wireguard_ip: "10.0.10.102"
    provider: aws
    region: ap-southeast-1
    instance: c7i.4xlarge
    roles: [bsc_dex, pancakeswap, sui, apac_failover]
    targets:
      dex: [pancakeswap, uniswap_bsc]
      chains: [bsc, sui]
    rtt_target_p95_ms: 1
    worker_port: 19100

  EDGE-USE:
    wireguard_ip: "10.0.10.103"
    provider: aws
    region: us-east-1
    instance: c7i.2xlarge
    roles: [l2_sequencers, flashbots_us, eth_relay_us, base_dex]
    targets:
      dex: [uniswap_base, aerodrome]
      chains: [arbitrum, optimism, base]
      infra: [flashbots_protect]
    rtt_target_p95_ms: 3
    worker_port: 19100

  EDGE-AMS:
    wireguard_ip: "10.0.10.104"
    provider: vultr
    region: amsterdam
    instance: bare_metal
    roles: [solana_grpc_redundancy, eth_relay_redundancy, nostr_relay, bridge_monitor]
    targets:
      chains: [solana_secondary]
      infra: [ams_ix_peering, nostr]
    rtt_target_p95_ms: 5
    worker_port: 19100

# Strategy → primary PoP (ARCHON/TRENCH-OPS route by venue + chain)
strategy_routing:
  P22: { primary: EDGE-FRA, fallback: [EDGE-AMS], note: "memecoin/Jito FRA; AMS gRPC backup" }
  P29: { primary: EDGE-FRA, fallback: [EDGE-USE], note: "MEV — Flashbots / EU builders" }
  P30: { primary: EDGE-TKY, fallback: [EDGE-SIN, EDGE-FRA], note: "cross-chain MEV · DEX" }
  P12: { primary: EDGE-FRA, fallback: [EDGE-USE], note: "intent solver EU/US builders" }
  P1:  { primary: EDGE-FRA, fallback: [EDGE-USE], note: "DEX cross-venue arb — Uniswap/Curve/Balancer" }
  P3:  { primary: EDGE-FRA, fallback: [EDGE-USE], note: "cross-rollup flash arb" }
  P5:  { primary: EDGE-TKY, fallback: [EDGE-FRA], note: "Hyperliquid DEX funding carry" }
  P7:  { primary: EDGE-FRA, fallback: [EDGE-USE], note: "DEX basis / spread" }
  P8:  { primary: EDGE-SIN, fallback: [EDGE-TKY], note: "APAC DEX / AMM" }
  P11: { primary: EDGE-USE, fallback: [EDGE-FRA], note: "prediction markets · US L2" }
  P6:  { primary: EDGE-FRA, fallback: [EDGE-USE], note: "liquidations ETH DeFi" }
  P18: { primary: EDGE-FRA, fallback: [EDGE-USE], note: "macro / L2 catalysts" }

venue_routing:
  hyperliquid: EDGE-TKY
  jito: EDGE-FRA
  solana_pumpfun: EDGE-FRA
  solana_pumpswap: EDGE-FRA
  solana_jupiter: EDGE-FRA
  flashbots_protect: EDGE-USE
  uniswap_v3: EDGE-FRA
  uniswap_v4: EDGE-FRA
  curve: EDGE-FRA
  balancer: EDGE-FRA
  pancakeswap: EDGE-SIN
  aerodrome: EDGE-USE
  paper: EDGE-FRA

bootstrap_order:
  - EDGE-FRA
  - EDGE-TKY
  - EDGE-SIN
  - EDGE-USE
  - EDGE-AMS

# Do NOT add a 6th PoP unless a promoted strategy targets an uncovered DEX/region.
add_pop_when:
  - "New DEX / sequencer cluster in a region not listed above"
  - "Sustained p95 RTT >25ms from nearest PoP during paper TCA"
  - "Human YES on promotion gate for region-specific pipeline"

cost_note: |
  Paper phase: use smallest instances (SIN/USE c7i.large, TKY metal only when APAC DEX lanes active).
  Scale metal TKY before live capital on P5/P8/P30 (Hyperliquid / APAC DEX).
