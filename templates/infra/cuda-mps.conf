# CUDA MPS partition weights — match gpu_schedule.yaml priorities
# Start: cuda-mps.service → nvidia-cuda-mps-control -d

# SM partition hints (percent of GPU when MPS active)
partitions:
  inference-critical:
    gpu: 0
    sm_pct: 85
    services: [llama-server-tier1, embedder]
  inference-high:
    gpu: 1
    sm_pct: 90
    services: [llama-server-tier2]
  compute-medium:
    gpu: 0
    sm_pct: 10
    services: [revm_simulation]
  compute-low:
    gpu: "0+1"
    sm_pct: 15
    services: [tier3_offline]
    market_hours: forbidden

env:
  CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
  CUDA_MPS_LOG_DIRECTORY: /tmp/nvidia-log
