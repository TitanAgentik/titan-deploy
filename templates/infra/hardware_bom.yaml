      fans_140mm: "4× Noctua NF-A14 iPPC-3000 PWM"
      fans_120mm: "7× Noctua NF-F12 iPPC-3000 PWM"
      fans_92mm: "2× Noctua NF-A9x14 HS-PWM chromax.Black.swap"
    timing:
      model: "LBE-1420 GPSDO"
