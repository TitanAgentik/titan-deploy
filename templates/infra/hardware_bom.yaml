      cores: 96
      threads: 192
      socket: sTR5
    motherboard:
      model: "ASUS Pro WS WRX90E-SAGE SE"
      pcie_lanes: 128
      pcie_gen: 5
      x16_slots: 7
    memory:
      model: "V-Color TRA564G56D436O"
      capacity_gb: 512
      dimms: 8
      dimm_size_gb: 64
      type: "DDR5-6000 CL36 ECC Registered R-DIMM"
      voltage: 1.25
