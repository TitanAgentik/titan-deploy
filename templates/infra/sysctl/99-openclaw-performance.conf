# TITAN low-latency network + scheduler tuning
# Install: sudo cp 99-openclaw-performance.conf /etc/sysctl.d/ && sudo sysctl --system

# TCP — low-latency buffers for WireGuard + exchange WS
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_fastopen = 3
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096

# Avoid swap latency on 512GB RAM trading host
vm.swappiness = 1
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3

# Scheduler — prefer responsiveness on critical path (9995WX)
kernel.sched_min_granularity_ns = 1000000
kernel.sched_wakeup_granularity_ns = 2000000

# Inotify / file handles for many WS feeds
fs.inotify.max_user_watches = 524288
