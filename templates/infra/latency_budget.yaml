# TITAN Latency Budget — millisecond-tier SLOs (FORGE enforces)
# Deploy: ~/.openclaw/infra/latency_budget.yaml

version: "1.1"
priority: millisecond_first

# ─── Hot path (sniper / MEV / memecoin) — target single-digit to low tens of ms ───
hot_path_ms:
  gate_combined_p95: 15           # /v1/fast_validate localhost
  gate_receipt_issue_p95: 2
  signing_verify_p95: 5
  edge_nostr_dispatch_p95: 3
  home_to_edge_fra_p95: 25        # Phase 1 WG; edge-colocated TRENCH-OPS skips this
  edge_to_jito_p95: 5
  edge_to_rpc_p95: 8
  total_submit_p95: 50            # intent → bundle/RPC ack (not block inclusion)
  signing_receipt_max_age_seconds: 10

# ─── Warm path (LLM-assisted lanes) — hundreds of ms acceptable ───
warm_path_ms:
  execution_gate_total: 150
  reconciliation: 50
  risk_kernel: 30
  tier1_ttft_slo_p95: 300
  embedder_p95: 15
  mem0_recall_p95: 20

# ─── Inference (not on hot path for P22/P29) ───
inference_ms:
  tier1_first_token_warm_p95: 250
  tier1_first_token_cold_p95: 2000
  tier2_prefill_must_not_block_tier1: true

feeds:
  nexus_staleness_max_seconds: 5   # ms-sensitive lanes need fresh feeds
  rpc_timeout_seconds: 1
  websocket_reconnect_ms: 200

phase1_constraints:
  apac_sub_ms_unavailable: false
  full_mesh_from_paper: true
  note: "All 5 PoPs active — route by venue; paper uses same path for latency TCA"

enforcement:
  agent: FORGE
  specs:
    - ~/.openclaw/infra/latency_fast_path.yaml
    - ~/.openclaw/infra/edge_hot_path.yaml
  on_breach:
    - herald_alert
    - log_posture_jsonl
  hard_halt:
    - hot_path_gate_p95_above_25ms_sustained_2m
    - home_to_edge_fra_p95_above_50ms_sustained_5m
